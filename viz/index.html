<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>OraclePageIndex — knowledge graph</title>
    <link rel="stylesheet" href="/viz/style.css">
</head>
<body>
    <!-- Header -->
    <header id="header">
        <div class="header-title">
            <h1>OraclePageIndex</h1>
            <span class="subtitle">Oracle AI Database knowledge graph</span>
        </div>
        <div class="header-controls">
            <input class="control" type="text" id="search-input" placeholder="Search" autocomplete="off" aria-label="Search nodes">
            <select class="control" id="layout-toggle" aria-label="Layout">
                <option value="force">Force layout</option>
                <option value="tree">Tree layout</option>
            </select>
            <button class="btn" id="reset-btn">Reset</button>
        </div>
    </header>

    <!-- Left rail: legend and counts read as one column of chrome -->
    <div id="left-rail">
        <div id="legend" class="panel" aria-label="Node types">
            <span class="legend-item">
                <span class="legend-swatch legend-swatch--document"></span>
                <span class="legend-label">Document</span>
            </span>
            <span class="legend-item">
                <span class="legend-swatch legend-swatch--section"></span>
                <span class="legend-label">Section</span>
            </span>
            <span class="legend-item">
                <span class="legend-swatch legend-swatch--entity"></span>
                <span class="legend-label">Entity</span>
            </span>
        </div>

        <!-- Stats bar -->
        <div id="stats-bar" class="panel">
            <span id="stats-text"></span>
        </div>
    </div>

    <!-- Timeline Controls -->
    <div id="timeline-controls" class="panel">
        <label class="timeline-label" for="version-slider">Version</label>
        <input type="range" id="version-slider" min="1" max="1" value="1">
        <span id="version-label" class="timeline-value">v1</span>
        <select class="control control--small" id="doc-group-select" aria-label="Document group">
            <option value="">All documents</option>
        </select>
    </div>

    <!-- Graph Container -->
    <svg id="graph-svg"></svg>

    <!-- Details Panel -->
    <aside id="details-panel" class="hidden" aria-label="Node details">
        <button id="details-close" aria-label="Close details">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="M4 4l8 8M12 4l-8 8"/>
            </svg>
        </button>
        <h2 id="detail-label"></h2>
        <div class="detail-row">
            <span class="detail-key">Type</span>
            <span id="detail-type" class="detail-value badge"></span>
        </div>
        <div class="detail-row" id="detail-entity-type-row">
            <span class="detail-key">Entity type</span>
            <span id="detail-entity-type" class="detail-value"></span>
        </div>
        <div class="detail-row" id="detail-node-id-row">
            <span class="detail-key">Node ID</span>
            <span id="detail-node-id" class="detail-value mono"></span>
        </div>
        <div class="detail-section" id="detail-summary-section">
            <h3>Summary</h3>
            <p id="detail-summary"></p>
        </div>
        <div class="detail-section" id="detail-description-section">
            <h3>Description</h3>
            <p id="detail-description"></p>
        </div>
        <div class="detail-section" id="detail-connections-section">
            <h3>Connections</h3>
            <ul id="detail-connections"></ul>
        </div>
    </aside>

    <!-- Query Interface -->
    <div id="query-interface">
        <input class="control" type="text" id="query-input" placeholder="Ask" aria-label="Ask a question">
        <button class="btn btn--primary" id="query-btn">Query</button>
        <button class="btn" id="clear-path-btn">Show full graph</button>
        <button class="btn" id="replay-btn">Replay</button>
    </div>

    <!-- Traversal Panel (shows SQL queries) -->
    <div id="traversal-panel" aria-label="Query traversal">
        <h3 class="panel-heading">Traversal</h3>
        <div id="traversal-steps"></div>
        <h3 class="panel-heading panel-heading--spaced">SQL/PGQ</h3>
        <div id="query-sql-list"></div>
        <div id="query-answer"></div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/viz/graph.js"></script>
</body>
</html>

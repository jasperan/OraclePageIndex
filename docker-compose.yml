version: "3.8"

services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest-lite
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD to a unique database password}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/${ORACLE_PWD:?Set ORACLE_PWD}@//localhost:1521/FREEPDB1 as sysdba", "@/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  oracle-data:
